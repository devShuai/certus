{{define "login.html"}}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="icon" type="image/svg+xml" sizes="any" href="/static/favicon.svg"><link rel="icon" type="image/svg+xml" sizes="32x32" href="/static/favicon-32.svg"><link rel="icon" type="image/svg+xml" sizes="16x16" href="/static/favicon-16.svg"><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="shell"><section class="card"><img class="app-logo" src="/static/logo-light.svg" alt="certus 统一认证中心" width="280" height="64"><p class="eyebrow">{{if .Client.Name}}登录到 {{.Client.Name}}{{else}}可信身份{{end}}</p><h1>可信身份，从这里开始</h1><p class="muted">请选择为此系统配置的登录方式。</p><div class="stack">{{range .Methods}}<button disabled>{{.Label}}登录（待接入）</button>{{else}}<p class="notice">请从已接入的业务系统发起登录。</p>{{end}}</div></section></main></body></html>{{end}}
