{{define "admin-clients.html"}}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="icon" type="image/svg+xml" sizes="any" href="/static/favicon.svg"><link rel="icon" type="image/svg+xml" sizes="32x32" href="/static/favicon-32.svg"><link rel="icon" type="image/svg+xml" sizes="16x16" href="/static/favicon-16.svg"><link rel="stylesheet" href="/static/app.css"><script src="/static/admin-clients.js" defer></script></head>
<body><main class="shell admin-shell"><section class="card admin-card"><img class="app-logo" src="/static/logo-light.svg" alt="certus 统一认证中心" width="280" height="64"><p class="eyebrow">管理控制台 · 接入系统</p><h1>配置跳转登录</h1><p class="muted">登记业务系统后，Certus 将生成标准 OpenID Connect 接入参数。</p>
<form id="client-form" class="form-grid">
<label class="full">管理员令牌<input id="admin-token" name="admin_token" type="password" autocomplete="off" required minlength="32" placeholder="CERTUS_ADMIN_TOKEN"></label>
<label>Client ID<input name="id" required pattern="[a-z0-9][a-z0-9_-]{1,62}" placeholder="finance"></label>
<label>系统名称<input name="name" required maxlength="128" placeholder="Finance"></label>
<label class="full">系统说明<input name="description" maxlength="256" placeholder="财务系统"></label>
<label>客户端类型<select name="application_type"><option value="confidential">服务端应用（confidential）</option><option value="public">浏览器/移动应用（public）</option></select></label>
<label>允许 Scope<input name="allowed_scopes" value="openid profile email" required></label>
<fieldset class="full"><legend>支持协议</legend><label class="check"><input type="checkbox" name="protocols" value="oauth2.0">OAuth 2.0</label><label class="check"><input type="checkbox" name="protocols" value="oauth2.1" checked>OAuth 2.1</label><label class="check"><input type="checkbox" name="protocols" value="cas">CAS</label></fieldset>
<fieldset class="full"><legend>OAuth/OIDC 流程</legend><label class="check"><input type="checkbox" name="grant_types" value="authorization_code" checked>授权码 + PKCE</label><label class="check"><input type="checkbox" name="grant_types" value="refresh_token" checked>刷新令牌</label><label class="check"><input type="checkbox" name="grant_types" value="client_credentials">客户端凭据</label><label class="check"><input type="checkbox" name="grant_types" value="urn:ietf:params:oauth:grant-type:device_code">设备码</label></fieldset>
<label class="full">OAuth/OIDC 回调地址，每行一个<textarea name="redirect_uris" rows="3" placeholder="https://finance.example.com/oidc/callback"></textarea></label>
<fieldset class="full"><legend>允许的登录方式</legend><label class="check"><input type="checkbox" name="login_methods" value="password" checked>账号密码</label><label class="check"><input type="checkbox" name="login_methods" value="ldap">企业 LDAP</label><label class="check"><input type="checkbox" name="login_methods" value="oidc">外部身份提供商</label></fieldset>
<label>CAS 版本<select name="cas_version"><option value="3.0">CAS 3.0</option><option value="2.0">CAS 2.0</option><option value="1.0">CAS 1.0</option></select></label>
<label class="full">CAS Service URL，每行一个<textarea name="cas_service_urls" rows="3" placeholder="https://legacy.example.com/login/cas"></textarea></label>
<fieldset class="full"><legend>CAS 行为</legend><label class="check"><input type="checkbox" name="cas_proxy">代理认证</label><label class="check"><input type="checkbox" name="cas_gateway">Gateway</label><label class="check"><input type="checkbox" name="cas_renew">Renew</label><label class="check"><input type="checkbox" name="cas_single_logout" checked>单点登出</label></fieldset>
<div class="full actions"><button type="submit">保存并生成接入参数</button><span id="form-status" role="status" aria-live="polite"></span></div>
</form></section>
<section id="integration-card" class="card admin-card hidden" aria-live="polite"><p class="eyebrow">配置完成</p><h2>接入参数</h2><p id="secret-warning" class="warning hidden">Client Secret 仅显示一次，请立即保存到业务系统的密钥存储中。</p><pre id="integration-output"></pre><div class="actions"><button id="copy-integration" type="button">复制参数</button><a href="/portal">查看中间落地页 →</a></div></section></main></body></html>{{end}}
