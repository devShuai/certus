{{define "mfa.html"}}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="icon" type="image/svg+xml" sizes="any" href="/static/favicon.svg"><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="shell"><section class="card"><img class="app-logo" src="/static/logo-light.svg" alt="certus 统一认证中心" width="280" height="64"><p class="eyebrow">第二步验证</p><h1>输入动态口令</h1><p class="muted">请输入认证器中的 6 位动态口令，也可以使用一枚尚未使用的恢复码。</p>{{if .Error}}<p class="warning" role="alert">{{.Error}}</p>{{end}}<form class="stack" method="post" action="/login/mfa"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><label>动态口令或恢复码<input name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label><label class="check"><input name="remember_device" type="checkbox"{{if .RememberDevice}} checked{{end}}>记住当前设备，30 天内免输动态口令</label><p class="muted">仅在个人设备上启用。修改密码、关闭 MFA 或手动撤销后会立即失效。</p><button type="submit">完成登录</button></form></section></main></body></html>{{end}}
