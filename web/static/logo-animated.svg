<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="certus 统一认证中心">
  <style>
    .token-left { animation: token-left-in 560ms cubic-bezier(.2, .85, .3, 1) both; }
    .token-right { animation: token-right-in 560ms cubic-bezier(.2, .85, .3, 1) both; }
    .wordmark { animation: wordmark-in 420ms 280ms ease-out both; }
    .subtitle { animation: wordmark-in 420ms 380ms ease-out both; }

    @keyframes token-left-in {
      0% { opacity: 0; transform: translateX(-10px); }
      72% { opacity: 1; transform: translateX(1px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes token-right-in {
      0% { opacity: 0; transform: translateX(10px); }
      72% { opacity: 1; transform: translateX(-1px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes wordmark-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .token-left,
      .token-right,
      .wordmark,
      .subtitle { animation: none; }
    }
  </style>
  <path class="token-left" d="M28 14 H11 A5 5 0 0 0 6 19 V45 A5 5 0 0 0 11 50 H26 L32 38 L22 26 Z" fill="none" stroke="#14161F" stroke-width="4.5" stroke-linejoin="round"></path>
  <path class="token-right" d="M36 14 H49 A5 5 0 0 1 54 19 V45 A5 5 0 0 1 49 50 H34 L40 38 L30 26 Z" fill="none" stroke="#C98A1E" stroke-width="4.5" stroke-linejoin="round"></path>
  <text class="wordmark" x="82" y="30" fill="#14161F" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="-0.2">cert<tspan fill="#C98A1E">us</tspan></text>
  <text class="subtitle" x="82" y="48" fill="#6B6E7B" font-family="system-ui, -apple-system, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="0.18em">统一认证中心</text>
</svg>
